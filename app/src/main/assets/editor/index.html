<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; object-src 'none'">
<title>FlowState editor</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui;background:#f3f7f3;color:#14281c}body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:8px;background:#13241c;color:#fff;flex-shrink:0}button,summary{min-height:48px;border:0;border-radius:10px;background:#e2ede5;color:#14281c;padding:10px 12px;font:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #67a578;outline-offset:2px}#save{background:#ace0b5;font-weight:600}#blocks{flex:1}details{position:relative}summary{list-style:none}summary::-webkit-details-marker{display:none}#more-menu{position:absolute;right:0;top:54px;width:220px;background:#fff;border-radius:12px;padding:8px;box-shadow:0 4px 24px #0004;z-index:20;display:grid;gap:4px}#more-menu button{text-align:left;background:#f3f7f3}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}#workspace{position:relative;z-index:0;width:100%;height:100%;background:#ecf3ed}#picker{position:absolute;inset:0;background:#f7faf5;z-index:10;display:flex;flex-direction:column}#picker[hidden]{display:none}.picker-heading{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-shrink:0}.picker-heading h1{font-size:20px;margin:0}.picker-heading button{background:#e2ede5}#catalogue{flex:1;overflow-y:auto;padding:0 16px 20px;overscroll-behavior:contain}.group h2{font-size:16px;margin:16px 0 8px}.block-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.block-choice{min-height:66px;text-align:left;background:#fff;border:1px solid #d3e0d5;border-left:4px solid #367448;display:flex;flex-direction:column;justify-content:center;gap:4px}.block-choice span{font-size:12px;color:#526459}.picker-tip{font-size:13px;padding:0 16px;margin:0 0 8px;color:#526459}#status{white-space:pre-wrap;padding:8px 12px;font-size:13px;max-height:90px;overflow:auto;flex-shrink:0;background:#f7faf5}#status:empty{display:none}.blocklyWidgetDiv input{font-size:16px!important}.blocklySvg{touch-action:none}
@media(min-width:700px){#picker{right:auto;width:340px;border-right:1px solid #d3e0d5}#stage.picker-open #workspace{margin-left:340px;width:calc(100% - 340px)}}
</style></head><body>
<header><button id="close" aria-label="Back to automations">Back</button><button id="save">Save</button><button id="blocks" aria-expanded="true" aria-controls="picker">Blocks</button><details id="more"><summary>More</summary><div id="more-menu"><button id="copy">Save copy</button><button id="validate">Check workflow</button><button id="simulate">Simulate</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="tidy">Arrange blocks</button><button id="advanced" aria-pressed="false">Show advanced fields</button></div></details></header>
<div id="stage" class="picker-open"><div id="workspace"></div><aside id="picker" aria-label="Block library"><div class="picker-heading"><h1>Choose a block</h1><button id="picker-close">Done</button></div><p class="picker-tip">Tap a block to add it. Actions connect below your workflow; drag blocks to change the order.</p><div id="catalogue"></div></aside></div>
<div id="status" role="status">Start with a message, question or checklist. Tap Done to edit your existing blocks.</div><script src="compat.js"></script><script src="editor.bundle.js"></script>
</body></html>
