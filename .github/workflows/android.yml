name: Android verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: blockly-editor/package-lock.json
      - name: Build and test offline editor
        working-directory: blockly-editor
        run: npm ci && npm test && npm run build
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify native application
        run: bash ./gradlew :engine:test :app:assembleDebug :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleRelease --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: FlowState-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
